name: Build ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - README.md
      - fastlane/**
      - assets/**
      - .github/**/*.md
      - .github/FUNDING.yml
      - .github/ISSUE_TEMPLATE/**

jobs:
  build-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and upstream core
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Configure full build
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Configure service secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          echo "SENTRY_DSN=$SENTRY_DSN" > ./local.properties
          echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" >> ./local.properties
          echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> ./local.properties
          echo "LASTFM_SECRET=$LASTFM_SECRET" >> ./local.properties
          echo "DISCORD_CLIENT_ID=$DISCORD_CLIENT_ID" >> ./local.properties

      - name: Generate library report
        run: ./gradlew exportLibraryDefinitions

      - name: Assemble ARM64 release APK
        run: ./gradlew --no-daemon androidApp:assembleRelease

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: simpmusic-arm64-v8a
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
