name: Update core submodule for Cloudflare status fix

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  update-core:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: pin core Cloudflare status fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SimpMusic
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          submodules: false

      - name: Pin core to the fix commit
        env:
          TARGET_CORE_SHA: 0b0d2fb9612dcfe0fb8f0946bf75a1d5d501cb78
        run: |
          CURRENT_CORE_SHA="$(git ls-tree HEAD core | awk '{print $3}')"
          echo "Current core: $CURRENT_CORE_SHA"
          echo "Target core:  $TARGET_CORE_SHA"

          if [ "$CURRENT_CORE_SHA" = "$TARGET_CORE_SHA" ]; then
            echo "Core is already pinned to the fix."
            exit 0
          fi

          git update-index --add --cacheinfo 160000 "$TARGET_CORE_SHA" core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: pin core Cloudflare status fix"
          git push origin HEAD:dev
